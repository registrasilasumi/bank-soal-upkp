name: Validasi bank soal

on:
  push:
  pull_request:

jobs:
  validasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bangun data web
        run: python3 scripts/build.py
      - name: Pastikan docs/data/bank-soal.json sudah di-commit
        run: git diff --exit-code -- docs/data/bank-soal.json || (echo "::error::docs/data/bank-soal.json belum diperbarui. Jalankan python3 scripts/build.py lalu commit." && exit 1)
      - name: Validasi
        run: python3 scripts/validate
